<style>
  :root {

  * { box-sizing: border-box; }
  /* The page never moves under the finger — not in Safari, not inside Viber's
     own browser (his 2026-10-09: „стои като допълнителен прозорец който се
     мести нагоре и надолу при опит за завъртане на 3дто"). */
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden;
    overscroll-behavior: none; touch-action: none; position: fixed; inset: 0; width: 100%; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; touch-action: none; }
  #inapp { display: none; position: fixed; left: 16px; right: 16px; top: calc(120px + env(safe-area-inset-top));
    background: #fff7d6; border: 1px solid #e8c95a; border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); z-index: 5; }
  #inapp p { margin: 0 0 8px; }
  #inapp .row { display: flex; gap: 8px; }
  #inapp button { flex: 1; box-shadow: none; font-size: 16px; }
  /* Made for the phone first (his 2026-10-09: „страницата трябва да е най вече
     за телефон пригодена"): every control a thumb's size, nothing that needs
     a mouse, no zoom on a double tap, no text picked up by a long press. */
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--card);
    border-radius: 14px; padding: 0 14px; min-height: 48px; min-width: 48px; cursor: pointer; box-shadow: var(--shadow);
    touch-action: manipulation; font-size: 17px; }
  button:active { transform: translateY(1px); }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .top { position: fixed; top: 0; left: 0; right: 0; padding: calc(10px + env(safe-area-inset-top)) 16px 0;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  /* Up there only 2D/3D, the start view and the chosen panel's card, in
     that order from the left (his 2026-10-09: „в горната част на екрана
     остави само бутона за начална позиция на камерата и за смяна-2д3д", then
     „2д 3Д бутона най в ляво другия след него и информацията на останалото
     пространство"); the rest of the strip lets the fingers through to the
     model. */
  .bar { display: flex; gap: 8px; align-items: center; justify-content: flex-start; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #btn2d { font-weight: 700; font-size: 16px; }
  /* The levels, one above the other, storey 1 at the bottom; each a little
     house lit green as far up as it shows (his 2026-10-09). */
  /* A drawer against the right edge, a third of the way down; swiped right
     it tucks away to its grip, swiped left (or the grip tapped) it comes back
     (his 2026-10-09: „по дефолт позиционирани по-нагоре … по-дискретни …
     може да се прибират с плъзгане", then on 2026-10-10 „сложи чекмеджето от
     дясно и малко по центрирано"). ORIGIN unasked — the third. */
  #levels { position: fixed; right: 0; top: calc(30% + env(safe-area-inset-top)); display: none; z-index: 2;
    align-items: center; padding: 5px 3px 5px 0; border-radius: 20px 0 0 20px;
    background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 6px 22px rgba(20,30,45,.16); transition: transform .25s ease; touch-action: none; }
  #levels.tucked { transform: translateX(calc(100% - 16px)); }
  /* The houses in a row over the slider, storey 1 on the left (his
     2026-10-10: „да пробваме да наредим бутоните хоризонтално над
     слайдера"; a try — the drawer on the right stays in the code, hidden). */
  #levelButtons { display: none; justify-content: space-around; gap: 2px; margin-bottom: 4px; }
  #grip { width: 16px; align-self: stretch; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #grip::before { content: ''; width: 4px; height: 34px; border-radius: 2px; background: #9aa6b2; }
  #levelButtons button { padding: 4px 6px; min-width: 52px; min-height: 50px; border: 0; border-radius: 14px;
    background: transparent; box-shadow: none; transition: background .15s, transform .1s; }
  #levelButtons button:active { transform: scale(.95); }
  #levelButtons button.on { background: #e6f8ee; box-shadow: inset 0 0 0 2px #10b981; color: var(--ink); }
  #levelButtons svg { display: block; margin: 0 auto; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }

    display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .bottom > * { pointer-events: auto; }
  .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 14px; }
  /* The chosen panel's card: up, after the two buttons, in the rest of the
     strip, as high as they are (his 2026-10-09: „направи информацията
     за селектирания панел да излиза горе на мястото където бяха бутоните
     които махнахме и я направи малко по компактна"). */
  #info { display: none; flex: 1; min-width: 0; align-self: stretch; align-items: center; gap: 8px; padding: 4px 10px; }
  #info .swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,.2); flex: none; }

  #steps .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #steps .row button { box-shadow: none; font-size: 20px; }
  #steps .what { color: var(--muted); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #steps .what b { color: var(--ink); }
  #empty { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  #empty .card { max-width: 420px; text-align: center; padding: 24px 20px; }
  #empty h1 { font-size: 20px; margin: 0 0 8px; }
  #empty p { color: var(--muted); margin: 0 0 16px; }

  #busy .card { min-width: 220px; text-align: center; }
  #busy .meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  #busy .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  #file { display: none; }
  @media (min-width: 720px) {
    .bottom { left: 50%; right: auto; transform: translateX(-50%); width: 640px; }

<div class="top">

</div>

class TurnControls {
  constructor(camera, element) {

    element.addEventListener('pointerdown', (e) => this.down(e));
    element.addEventListener('pointermove', (e) => this.move(e));
    element.addEventListener('pointerup', (e) => this.up(e));
    element.addEventListener('pointercancel', (e) => this.up(e));
    element.addEventListener('wheel', (e) => {
      if (!this.enabled) return;

      this.zoomAt(Math.exp(e.deltaY * 0.001), e.clientX, e.clientY);

  move(e) {

    if (!p) return;
    const dx = e.clientX - p.x;
    const dy = e.clientY - p.y;
    p.x = e.clientX;
    p.y = e.clientY;
    if (this.pointers.size === 1) {

      const speed = (2 * Math.PI) / Math.max(this.element.clientHeight, 1);
      const upright = Math.cos(this.phi) >= 0 ? 1 : -1;  // over the top, left stays left
      this.theta -= dx * speed * upright;
      this.phi += dy * speed;
    } else if (this.pointers.size === 2) {
      const [a, b] = [...this.pointers.values()];
      const span = Math.hypot(a.x - b.x, a.y - b.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };

      if (this.pinch && span > 0) {
        this.zoomAt(this.pinch.span / span, mid.x, mid.y);
        this.pan(mid.x - this.pinch.mid.x, mid.y - this.pinch.mid.y);
        // A twist of the two fingers turns the house round its vertical, the
        // way the fingers turn (his 2026-10-09: „добави и усукване на два
        // пръста= въртене … но запази сегашното поведение на въртенето").

        if (turn < -Math.PI) turn += 2 * Math.PI;

  }
  pan(dx, dy) {
    const scale = (2 * this.radius * Math.tan(THREE.MathUtils.degToRad(this.camera.fov / 2))) / Math.max(this.element.clientHeight, 1);
    const right = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 1);

  }

  }

      const ndc = new THREE.Vector2(((x - rect.left) / rect.width) * 2 - 1, -((y - rect.top) / rect.height) * 2 + 1);

    this.camera.position.copy(this.target).addScaledVector(towards, this.radius);

// zooms where it points; it never turns. The levels and the steps are the
// same as in 3D — only the view changes. His 2026-10-09: „направи и бутон 2д
// който вклучва 2д изгледи на етажите и кое след кое се реди пак със стрелки
// и слайдер и зум и местене". ORIGIN unasked — the plan from above, the
// button's place.
// Turned a quarter from SketchUp's top view, so the veranda faces us (his
// 2026-10-09: „обърни къщата на 90 градуса в 2д-то … така че верандата на
// къщата да гледа към нас"): SketchUp's red axis up the screen, its green

class PlanControls {
  constructor(camera, element) {
    this.camera = camera;
    this.element = element;
    this.screenRight = new THREE.Vector3(0, 0, 1);   // glTF +z = SketchUp −y
    this.screenUp = new THREE.Vector3(1, 0, 0);      // glTF +x = SketchUp +x
    this.target = new THREE.Vector3();
    this.half = 10;       // half the height of the screen, in metres
    this.height = 100;    // where the camera hangs
    this.enabled = false;
    this.pointers = new Map();
    this.pinch = null;
    element.addEventListener('pointerdown', (e) => this.down(e));
    element.addEventListener('pointermove', (e) => this.move(e));
    element.addEventListener('pointerup', (e) => this.up(e));
    element.addEventListener('pointercancel', (e) => this.up(e));
    element.addEventListener('wheel', (e) => {
      if (!this.enabled) return;
      e.preventDefault();
      this.zoomAt(Math.exp(e.deltaY * 0.001), e.clientX, e.clientY);
    }, { passive: false });
  }
  down(e) {
    if (!this.enabled) return;
    this.element.setPointerCapture(e.pointerId);
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    this.pinch = null;
  }
  up(e) {
    this.pointers.delete(e.pointerId);
    this.pinch = null;
  }
  move(e) {
    const p = this.pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x;
    const dy = e.clientY - p.y;
    p.x = e.clientX;
    p.y = e.clientY;
    if (this.pointers.size === 1) {
      this.pan(dx, dy);
    } else if (this.pointers.size === 2) {
      const [a, b] = [...this.pointers.values()];
      const span = Math.hypot(a.x - b.x, a.y - b.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (this.pinch && span > 0) {
        this.zoomAt(this.pinch.span / span, mid.x, mid.y);
        this.pan(mid.x - this.pinch.mid.x, mid.y - this.pinch.mid.y);
      }
      this.pinch = { span, mid };
    }
  }
  // The plan follows the finger.
  pan(dx, dy) {
    const scale = (2 * this.half) / Math.max(this.element.clientHeight, 1);
    this.target.addScaledVector(this.screenRight, -dx * scale).addScaledVector(this.screenUp, dy * scale);
  }
  // The point of the plan under (x, y) stays under it.
  zoomAt(factor, x, y) {
    const next = THREE.MathUtils.clamp(this.half * factor, 0.2, 5000);
    const f = next / this.half;
    const rect = this.element.getBoundingClientRect();
    const nx = ((x - rect.left) / rect.width) * 2 - 1;
    const ny = -((y - rect.top) / rect.height) * 2 + 1;
    const point = this.target.clone()
      .addScaledVector(this.screenRight, nx * this.half * (rect.width / Math.max(rect.height, 1)))
      .addScaledVector(this.screenUp, ny * this.half);
    this.target.sub(point).multiplyScalar(f).add(point);
    this.half = next;
  }
  update() {
    const c = this.camera;
    const aspect = this.element.clientWidth / Math.max(this.element.clientHeight, 1);
    c.left = -this.half * aspect;
    c.right = this.half * aspect;
    c.top = this.half;
    c.bottom = -this.half;
    c.position.set(this.target.x, this.height, this.target.z);
    c.up.copy(this.screenUp);
    c.lookAt(this.target.x, this.height - 1, this.target.z);
    c.updateProjectionMatrix();
  }
}
const planCamera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.05, 1000);
const planControls = new PlanControls(planCamera, renderer.domElement);
let flat = false;         // the 2D view is on
let view = camera;        // the camera the picture is drawn with

// The stages of the assembly, as the plugin writes them (S1 storey 1 with the
// stair, F the floor, S2 storey 2, R the roof).
function stageName(key) {
  const storey = /^S(\d+)$/.exec(key || '');
  if (storey) return `Етаж ${storey[1]}`;
  return { F: 'Под', R: 'Покрив', B: 'Основа' }[key] || key || 'Други';
}

let model = null;
let blocks = [];          // { object, name, placement, stage, stageOrder, bodies, letters, colour }
let stages = [];          // [{ key, order }]
let levels = [];          // the stages with a button, bottom up (the foundation has none)
let upTo = -1;            // the level being put up now (-1: nothing yet)
let sequence = [];        // the blocks of the stages that are on, in the order they go up
let lettersOn = true;
let selected = null;

const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x1f2a36, transparent: true, opacity: 0.55 });

const isLetters = (mesh) => ((mesh.material && mesh.material.name) || '').toLowerCase().startsWith('mn assembly letters');
const numbered = (b) => Number.isInteger(b.placement);

function busy(text, part) {
  $('busy').style.display = text ? 'flex' : 'none';
  if (text) $('busyText').textContent = text;
  $('busyBar').style.width = `${Math.round((part || 0) * 100)}%`;
}

function clear() {
  if (!model) return;
  scene.remove(model);
  model.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  model = null;
  blocks = [];
  selected = null;
}

function blockOf(object) {
  for (let o = object; o; o = o.parent) {
    const found = blocks.find((b) => b.object === o);
    if (found) return found;
  }
  return null;
}

// The lines on a block: only where its surface really folds (over 25°), never
// across a flat face — also where two flat pieces of one face meet without
// sharing their corners (a T, or a hair apart), lie in different materials,
// or one of them is turned inside out. His 2026-10-09: „в браузъра ако няма
// реален ръб а е плоско да не излиза черна линия. За да се подсигурим".
// Before: three.js EdgesGeometry per material, which draws every edge that
// finds no twin in its own mesh. ORIGIN unasked — the half millimetre.
const FOLD = Math.cos(THREE.MathUtils.degToRad(25));
const NEAR = 0.0005;   // half a millimetre, in metres

// Two faces meeting along p–q are one flat surface: they lie in one plane
// (whichever way each faces) and on the two sides of the line.
function flatAcross(p, q, one, other) {
  if (Math.abs(one.normal.dot(other.normal)) < FOLD) return false;
  const d = new THREE.Vector3().subVectors(q, p).normalize();
  const across = (apex) => {
    const w = new THREE.Vector3().subVectors(apex, p);
    return w.addScaledVector(d, -w.dot(d));
  };
  return across(one.apex).dot(across(other.apex)) < 0;
}

function foldLines(block) {
  const root = block.object;
  root.updateWorldMatrix(true, true);
  const toRoot = root.matrixWorld.clone().invert();
  const ids = new Map();
  const corners = [];
  const corner = (v) => {
    const key = `${Math.round(v.x / NEAR)},${Math.round(v.y / NEAR)},${Math.round(v.z / NEAR)}`;
    let n = ids.get(key);
    if (n === undefined) { n = corners.length; ids.set(key, n); corners.push(v); }
    return n;
  };
  const edges = new Map();   // "i,j" → { i, j, sides: [{ normal, apex }] }
  for (const mesh of block.bodies) {
    const position = mesh.geometry.attributes.position;
    const index = mesh.geometry.index;
    const toBlock = new THREE.Matrix4().multiplyMatrices(toRoot, mesh.matrixWorld);
    const count = index ? index.count : position.count;
    for (let t = 0; t + 2 < count; t += 3) {
      const v = [0, 1, 2].map((k) => new THREE.Vector3().fromBufferAttribute(position, index ? index.getX(t + k) : t + k).applyMatrix4(toBlock));
      const normal = new THREE.Vector3().subVectors(v[1], v[0]).cross(new THREE.Vector3().subVectors(v[2], v[0]));
      if (normal.lengthSq() < 1e-14) continue;   // no area
      normal.normalize();
      const n = v.map(corner);
      for (let k = 0; k < 3; k++) {
        const i = Math.min(n[k], n[(k + 1) % 3]);
        const j = Math.max(n[k], n[(k + 1) % 3]);
        if (i === j) continue;
        const key = `${i},${j}`;
        if (!edges.has(key)) edges.set(key, { i, j, sides: [] });
        edges.get(key).sides.push({ normal, apex: v[(k + 2) % 3] });
      }
    }
  }
  const segments = [];
  const open = [];
  for (const e of edges.values()) {
    const p = corners[e.i];
    const q = corners[e.j];
    if (e.sides.length === 1) {
      open.push({ p, q, side: e.sides[0], dir: new THREE.Vector3().subVectors(q, p).normalize(), length: p.distanceTo(q) });
    } else if (e.sides.slice(1).some((s) => !flatAcross(p, q, e.sides[0], s))) {
      segments.push(p, q);
    }
  }
  // An edge with one face only: drawn unless another face's edge lies along
  // it and that face goes on flat. Edges are sorted by direction first, so
  // only edges of one direction are compared.
  const buckets = new Map();
  for (const o of open) {
    const d = o.dir.clone();
    if (d.x < -1e-6 || (Math.abs(d.x) <= 1e-6 && (d.y < -1e-6 || (Math.abs(d.y) <= 1e-6 && d.z < 0)))) d.negate();
    const key = `${Math.round(d.x * 50)},${Math.round(d.y * 50)},${Math.round(d.z * 50)}`;
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(o);
  }
  const along = (o, other) => {
    const at = (v) => {
      const w = new THREE.Vector3().subVectors(v, o.p);
      const t = w.dot(o.dir);
      return { t, gap: w.addScaledVector(o.dir, -t).length() };
    };
    const a = at(other.p);
    const b = at(other.q);
    if (a.gap > 2 * NEAR || b.gap > 2 * NEAR) return false;
    return Math.min(o.length, Math.max(a.t, b.t)) - Math.max(0, Math.min(a.t, b.t)) > 2 * NEAR;
  };
  for (const list of buckets.values()) {
    for (const o of list) {
      let found = false;
      let fold = false;
      for (const other of list) {
        if (other === o || !along(o, other)) continue;
        found = true;
        if (!flatAcross(o.p, o.q, o.side, other.side)) { fold = true; break; }
      }
      if (!found || fold) segments.push(o.p, o.q);
    }
  }
  if (!segments.length) return;
  block.lines = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(segments), edgeMaterial);
  root.add(block.lines);
}

// The panels' colours on the page: all around beige, none glaring, each
// unlike its neighbours (his 2026-10-09: „да пробваме да направим цветовете
// на панелите в програмата да са различни но да са всички около бежовото без
// някакви супер ярки"). Only on the page — SketchUp's scheme keeps its own
// colours. Neighbours: boxes within 200 mm, as in SketchUp (`colours.rb`); the
// busiest block first, each takes the tone most unlike its neighbours' (CIE76
// in Lab), the least used among equals. Dark letters on every one. The
// foundation keeps its concrete and wood. ORIGIN unasked — the sixteen tones.
const BEIGES = [0xe8dcc4, 0xd9c7a7, 0xcdb892, 0xbfa77f, 0xe3d3b6, 0xd8c3b0, 0xc9b19c, 0xd6cdb4,
  0xc4bba0, 0xd2c9a4, 0xbdb592, 0xe6d5bc, 0xcfb79a, 0xb9a386, 0xdccfb8, 0xc8bfae];

function lab(hex) {
  const c = new THREE.Color(hex);   // linear RGB
  const x = (0.4124 * c.r + 0.3576 * c.g + 0.1805 * c.b) / 0.95047;
  const y = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
  const z = (0.0193 * c.r + 0.1192 * c.g + 0.9505 * c.b) / 1.08883;
  const f = (t) => (t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116);
  return [116 * f(y) - 16, 500 * (f(x) - f(y)), 200 * (f(y) - f(z))];
}

function recolour() {
  const tones = BEIGES.map(lab);
  const unlike = (i, j) => Math.hypot(tones[i][0] - tones[j][0], tones[i][1] - tones[j][1], tones[i][2] - tones[j][2]);
  const list = blocks.filter((b) => b.stage !== 'B' && b.bodies.length);
  const boxes = new Map(list.map((b) => [b, new THREE.Box3().setFromObject(b.object)]));
  const gap = (p, q) => Math.hypot(
    Math.max(0, p.min.x - q.max.x, q.min.x - p.max.x),
    Math.max(0, p.min.y - q.max.y, q.min.y - p.max.y),
    Math.max(0, p.min.z - q.max.z, q.min.z - p.max.z));
  const around = new Map(list.map((b) => [b, list.filter((o) => o !== b && gap(boxes.get(b), boxes.get(o)) <= 0.2)]));
  const order = [...list].sort((p, q) => around.get(q).length - around.get(p).length ||
    p.name.localeCompare(q.name, 'bg', { numeric: true }));
  const tone = new Map();
  const used = BEIGES.map(() => 0);
  for (const b of order) {
    const taken = around.get(b).filter((o) => tone.has(o)).map((o) => tone.get(o));
    let best = 0;
    let bestScore = -1;
    BEIGES.forEach((_, i) => {
      const score = taken.length ? Math.min(...taken.map((j) => unlike(i, j))) : Infinity;
      if (score > bestScore || (score === bestScore && used[i] < used[best])) { best = i; bestScore = score; }
    });
    tone.set(b, best);
    used[best] += 1;
    for (const m of b.bodies) { m.material.color.setHex(BEIGES[best]); m.userData.base = m.material.color.clone(); }
    for (const m of b.letters) { m.material.color.setHex(0x1f1f1f); m.userData.base = m.material.color.clone(); }
    b.colour = new THREE.Color(BEIGES[best]);
  }
}

function show(gltf, label) {
  select(null);
  clear();
  model = gltf.scene;
  model.traverse((o) => {
    const data = o.userData || {};
    if (data.name !== undefined && data.colour !== undefined) {
      blocks.push({
        object: o, name: data.name, placement: data.placement ?? null,
        stage: data.stage || 'S1', stageOrder: Number.isFinite(data.stage_order) ? data.stage_order : 1,
        bodies: [], letters: []
      });
    }
  });
  for (const block of blocks) {
    block.object.traverse((o) => {
      if (!o.isMesh) return;
      o.material = o.material.clone();   // its own material: lighting one block lights only it
      if (isLetters(o)) {
        block.letters.push(o);
        o.userData.base = o.material.color.clone();
      } else {
        block.bodies.push(o);
        block.colour = o.material.color.clone();
        o.userData.base = o.material.color.clone();
      }
    });
    foldLines(block);
  }
  recolour();
  scene.add(model);
  const extras = (gltf.scenes && gltf.scenes[0] && gltf.scenes[0].userData) || {};
  // The model's name only on the browser's tab: nothing of it on the screen
  // (his „в горната част на екрана остави само бутона …").
  document.title = `${extras.title || label || 'Монтажна схема'} — монтажна схема`;

  const keys = new Map();
  for (const x of blocks) if (!keys.has(x.stage)) keys.set(x.stage, x.stageOrder);
  stages = [...keys].map(([key, order]) => ({ key, order })).sort((p, q) => p.order - q.order);
  levels = stages.filter((st) => st.key !== 'B');
  upTo = -1;
  const column = $('levelButtons');
  column.replaceChildren(...levels.map((st, i) => {
    const button = document.createElement('button');
    button.innerHTML = houseIcon(levels, i);
    button.title = stageName(st.key);
    button.setAttribute('aria-label', stageName(st.key));
    // Pressed again where its level ends, the level goes too and the one
    // under it stays (his „като натиснеш още един път първия етаж да се скрива
    // и той" — then only the foundation is left).
    button.onclick = () => jumpTo(shown === levelEnd(i) ? i - 1 : i);
    return button;
  }));
  $('levelButtons').style.display = levels.length > 1 ? 'flex' : 'none';

  $('empty').style.display = 'none';
  setLetters(lettersOn);
  // A model opens at step 0 — the bare foundation, „▶" puts up the first
  // panel — and the view takes in the whole house (his 2026-10-09: „направи
  // програмката да стартира от позиция 0 на реденето на панелите а не от
  // наредени панели").
  restage(0);
  fit(true);
}

// A level button moves the steps to where that level's putting up ends — its
// panels and everything under it stand, nothing above — and ◀ ▶ go on from
// there through the whole order (his 2026-10-09: „ако цъкнеш флор показва 1
// плус флор ако цъкнеш етаж две - 1+ флор + 2", then on 2026-10-10 „направи и
// бутоните в чекмеджето да местят курсора на съответното място- до където е
// стигнало реденето и да можеш да продължаваш с него"). The level ends where
// the next one's phase begins: a late storey-1 panel (the veranda's walls)
// comes with the phase it goes up in. The foundation stands always.
function levelEnd(i) {
  return i < 0 ? 0 : sequence.filter((b) => b.phase <= levels[i].order).length;
}

function jumpTo(i) {
  setStep(levelEnd(i));
}

// The drawer stays where it is; nothing at the bottom moves it any more.
function placeLevels() {}

// The lit house is the level being put up now — stepping into the next level
// lights its house (his 2026-10-10: „когато покриеш един етаж това да
// рефлектира и на бутоните в чекмеджето"). Nothing lit at step 0.
function markLevels() {
  const phase = shown > 0 ? sequence[shown - 1].phase : null;
  upTo = phase === null ? -1 : levels.reduce((at, st, k) => (st.order <= phase ? k : at), -1);
  [...$('levelButtons').children].forEach((button, k) => button.classList.toggle('on', k === upTo));
}

// Swipe the drawer right to tuck it away, left (or tap the grip) to bring it
// back; a swipe is no press of the button it started on. It starts tucked
// away, open only where it was left open — each app (Chrome, Facebook,
// Viber) keeps its own memory, so a page opened from a Facebook link knew
// nothing of the drawer tucked in Chrome (his 2026-10-10: „ако отворя
// програмата от линк през фейсбук стартира с отворено чекмедже").
(() => {
  const drawer = $('levels');
  let from = null;
  let swiped = false;
  const tuck = (on) => {
    drawer.classList.toggle('tucked', on);
    try { localStorage.setItem('mn-levels-tucked', on ? '1' : '0'); } catch (e) { /* no storage */ }
  };
  let open = false;
  try { open = localStorage.getItem('mn-levels-tucked') === '0'; } catch (e) { /* no storage */ }
  drawer.classList.toggle('tucked', !open);
  drawer.addEventListener('pointerdown', (e) => { from = e.clientX; swiped = false; });
  drawer.addEventListener('pointermove', (e) => {
    if (from === null) return;
    const dx = e.clientX - from;
    if (dx > 28 && !drawer.classList.contains('tucked')) { tuck(true); swiped = true; from = null; }
    if (dx < -28 && drawer.classList.contains('tucked')) { tuck(false); swiped = true; from = null; }
  });
  drawer.addEventListener('pointerup', () => { from = null; });
  drawer.addEventListener('click', (e) => {
    if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; }
  }, true);
  $('grip').addEventListener('click', () => tuck(!drawer.classList.contains('tucked')));
})();

// The little house of a level button — a barnhouse seen from its gable, after
// the picture he sent on 2026-10-10 (Norges Hus, „Koia"): a wide house, the
// roof at about 40°, the roof's and the walls' edge one thick dark frame;
// boards standing at the sides; a slab a floor (his „направи флоор по-дебело
// зелено"). Bottom up,
// green only the level the button stands for, the rest grey; no windows (his
// „махни прозорчетата и направи да е в зелено само етажа на който отговаря
// бутончето") (his 2026-10-09 „и ги направи малко по-готини", 2026-10-10
// „да прилича повече на барнхаус погледнат в предната фасада", „не толкова
// стръмен покрив и по-широка къщата … страничния контур като типичната за
// барнхаус обобщаваща форма", then the picture). ORIGIN unasked — every
// measure and colour of it.
let iconCount = 0;
function houseIcon(list, lit) {
  const id = `h${iconCount += 1}`;
  const width = 46;
  const left = 5;
  const right = width - 5;
  const mid = width / 2;
  const sizes = { storey: 12, slab: 4, roof: 15 };
  const kinds = list.map((st) => (st.key === 'R' ? 'roof' : (st.key === 'F' ? 'slab' : 'storey')));
  const total = kinds.reduce((sum, kind) => sum + sizes[kind], 0) + 4;
  const bottom = total - 1.5;
  let y = bottom;
  let eaves = null;
  const frame = '#263238';
  const defs = `<defs>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="${id}r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fb889"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="${id}o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e7eb"/><stop offset="1" stop-color="#c3cad2"/></linearGradient>
  </defs>`;
  const line = (x1, y1, x2, y2, colour, w) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${colour}" stroke-width="${w}"/>`;
  const shapes = kinds.map((kind, i) => {
    const h = sizes[kind];
    const top = y - h;
    y = top;
    const on = i === lit;
    if (kind === 'roof') {
      eaves = top + h;
      const fill = on ? `url(#${id}r)` : `url(#${id}o)`;
      return `<polygon points="${left},${eaves} ${right},${eaves} ${mid},${top}" fill="${fill}"/>`;
    }
    if (kind === 'slab') {
      return `<rect x="${left}" y="${top}" width="${right - left}" height="${h}" fill="${on ? '#10b981' : '#aab3bc'}"/>`;
    }
    const fill = on ? `url(#${id}g)` : `url(#${id}o)`;
    const board = on ? 'rgba(6,78,59,.35)' : 'rgba(80,90,100,.25)';
    const boards = [left + 2.5, left + 5, right - 2.5, right - 5].map((x) => line(x, top + 1, x, top + h - 1, board, 0.5)).join('');
    return `<rect x="${left}" y="${top}" width="${right - left}" height="${h}" fill="${fill}"/>` + boards;
  });
  // The silhouette: the walls and the roof one thick dark frame, the ground
  // line thin (his „направи страничните линии на фасадата дебели като
  // покривните. Да оформят една рамка").
  const rim = eaves === null
    ? `M${left},${bottom} V${y} H${right} V${bottom}`
    : `M${left},${bottom} V${eaves} L${mid},${y} L${right},${eaves} V${bottom}`;
  shapes.push(`<path d="M${left},${bottom} H${right}" fill="none" stroke="${frame}" stroke-width="1.4"/>`);
  shapes.push(`<path d="${rim}" fill="none" stroke="${frame}" stroke-width="3" stroke-linejoin="miter"/>`);
  // A quarter bigger than in the drawer: the row over the slider has room.
  return `<svg viewBox="0 0 ${width} ${total}" width="${Math.round(width * 1.25)}" height="${Math.round(total * 1.25)}" aria-hidden="true">${defs}${shapes.join('')}</svg>`;
}

// The order the blocks go up: by placement number; the ones without a number
// after them, stage by stage, by name. ORIGIN unasked 2026-10-09 — his „като
// натискаш бутон напред се добавят всеки следващ панел"; the order without
// numbers is the assistant's.
//
// The steps count how many of them stand: 0 … all, over the whole order of
// every level (his 2026-10-09: „лентата за скрол и стрелките да не се скриват
// с първия етаж. просто да стоят на 0 когато е скрит").
let shown = 0;

function restage(count = null) {
  sequence = blocks.filter((b) => b.stage !== 'B').sort((p, q) =>
    (numbered(p) ? 0 : 1) - (numbered(q) ? 0 : 1) ||
    (p.placement ?? 0) - (q.placement ?? 0) ||
    p.stageOrder - q.stageOrder ||
    p.name.localeCompare(q.name, 'bg', { numeric: true }));
  // Each block's phase: the highest stage put up by the time it goes up. A
  // panel of storey 1 numbered after the floor (the veranda's walls, EW1 09
  // and 10 in his model) goes up in the phase of the floor, so the stages
  // under it do not light up again in 2D (his 2026-10-09: „като нареждаш еу
  // 1 9 и 10 етажите от долу стават пак ярки … да не стават ярки етажите от
  // долу докато се слагат тези панели").
  let reached = -Infinity;
  for (const b of blocks) b.phase = null;
  for (const b of sequence) { reached = Math.max(reached, b.stageOrder); b.phase = reached; }
  $('steps').style.display = blocks.some((b) => b.stage !== 'B') ? 'block' : 'none';
  placeLevels();
  $('stepRange').min = 0;
  $('stepRange').max = sequence.length;
  setStep(count === null ? sequence.length : count);
}

// How a block looks: the chosen one lit in the colour of choosing — one
// bright blue, the same for every panel, glowing with a blue halo so it
// stands apart (his 2026-10-09: „избран панел да светва в цвят за
// селектиране", „и селектирания го направи така да става"); every other
// panel in its beige with a warm glow — the glow that used to mark only the
// last one put up is now every panel's own (his „направи малко по топлото
// светене да е главния цвят на панелите … да не свети последния панел. Само
// селектиран в синьо"). The foundation keeps its concrete and wood. ORIGIN
// unasked — the blue.
const PICKED = new THREE.Color(0x2f7bff);
const PICKED_GLOW = 0x0b3a99;
const WARM = 0x553300;
// The last panel put up while stepping: green, glowing, with a green halo
// round it (his 2026-10-09, after „да не свети последния панел": „направи го
// последния поставен панел в някакво зеленичко да свети ама можеш ли да го
// направиш като да грее … с намалящ градиент"). ORIGIN unasked — the
// greens, the halo's size.
// (A softer green was tried side by side on 2026-10-10; his „старото зелено
// сложи".)
const NEWEST = new THREE.Color(0x8fe3a0);
const NEWEST_GLOW = 0x0c5a24;

// In 2D the stages under the one being put up now go pale: putting up the
// floor, storey 1 fades; putting up storey 2, the floor too (his 2026-10-09:
// „в две дто когато минеш от първи етаж на редене на под първия да
// избледнява, когато минеш от под на втори етаж пода да избледнява"). The
// stage being put up is the last placed block's phase (at step 0 the first
// one's); a block goes pale when its own phase is lower — a late storey-1
// panel stays bright while its phase is the one being built (see `restage`).
// The foundation is pale in 2D all the time, storey 1 too being put up on it
// (his „направи и фундамента да бледнее в две дто докато редиш етаж 1").
// ORIGIN unasked — how pale, the letters and lines going with their panel.
const PAPER = new THREE.Color(0xeef1f4);
const paleEdges = new THREE.LineBasicMaterial({ color: 0x1f2a36, transparent: true, opacity: 0.15 });
function pale(block) {
  if (!flat) return false;
  if (block.stage === 'B') return true;
  if (!sequence.length) return false;
  const now = (shown > 0 ? sequence[shown - 1] : sequence[0]).phase;
  return (block.phase ?? block.stageOrder) < now;
}

function look(block) {
  const picked = block === selected;
  const fresh = !picked && block === newest;
  const faded = !picked && !fresh && pale(block);
  const warm = block.stage !== 'B' && !faded;
  for (const m of block.bodies) {
    m.material.color.copy(picked ? PICKED : (fresh ? NEWEST : m.userData.base));
    if (faded) m.material.color.lerp(PAPER, 0.7);
    m.material.emissive.setHex(picked ? PICKED_GLOW : (fresh ? NEWEST_GLOW : (warm ? WARM : 0x000000)));
  }
  for (const m of block.letters) {
    m.material.color.copy(m.userData.base);
    if (faded) m.material.color.lerp(PAPER, 0.8);
  }
  if (block.lines) block.lines.material = faded ? paleEdges : edgeMaterial;
}

// count: how many of the sequence stand (0 … all); stepped: the count came
// from ◀ ▶ or the slider — then the last one put up glows (a level shown
// whole does not).
let newest = null;
function setStep(count, stepped = false) {
  changed();
  shown = Math.min(Math.max(count, 0), sequence.length);
  newest = stepped && shown > 0 ? sequence[shown - 1] : null;
  for (const b of blocks) {
    const at = sequence.indexOf(b);
    b.object.visible = b.stage === 'B' || (at >= 0 && at < shown);
  }
  if (selected && !selected.object.visible) select(null);
  for (const b of blocks) look(b);
  halo();
  markLevels();
  $('stepRange').value = shown;
  if (shown === sequence.length && shown > 0) {
    $('stepWhat').textContent = `Видими: ${sequence.length}. „◀" маха, „▶" добавя по един.`;
  } else if (shown === 0) {
    $('stepWhat').textContent = `0 от ${sequence.length}. „▶" добавя по един.`;
  } else {
    const b = sequence[shown - 1];
    const t = document.createElement('span');
    // „Панел 25 от 55", over the houses (his 2026-10-10: „нека пише ,, панел
    // 25 от55 ,, а не стъпка. И този надпис го направи над бутоните").
    t.textContent = `Панел ${shown} от ${sequence.length}: `;
    const n = document.createElement('b');
    n.textContent = `${numbered(b) ? `№ ${b.placement} · ` : ''}${b.name}`;
    $('stepWhat').replaceChildren(t, n);
  }
}

function move(delta) {
  setStep(shown + delta, true);
}

// The view takes in what the levels that are on will hold when every step
// stands (and the foundation) — not only what stands now, so it does not jump
// at step 0. both: the 3D and the 2D view together (a model just opened).
function fit(both = false) {
  if (!model) return;
  const box = new THREE.Box3();
  for (const block of blocks) if (block.stage === 'B' || sequence.includes(block)) box.expandByObject(block.object);
  if (box.isEmpty()) box.setFromObject(model);
  if (both || flat) fitPlan(box);
  if (both || !flat) fitTurn(box);
}

// The plan in the free part of the screen: under the buttons at the top,
// over the steps at the bottom, left of the levels.
function fitPlan(box) {
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const w = window.innerWidth;
  const h = window.innerHeight;
  const top = document.querySelector('.top').getBoundingClientRect().bottom + 8;
  const bottom = document.querySelector('.bottom').getBoundingClientRect().top - 8;
  const drawer = $('levels');
  const left = 8;
  const right = (getComputedStyle(drawer).display === 'none' ? w : Math.min(drawer.getBoundingClientRect().left, w)) - 8;
  const across = Math.abs(size.dot(planControls.screenRight));
  const upward = Math.abs(size.dot(planControls.screenUp));
  const perPixel = Math.max(across / Math.max(right - left, 50), upward / Math.max(bottom - top, 50), 0.001) * 1.1;
  planControls.half = (perPixel * h) / 2;
  planControls.target.copy(centre)
    .addScaledVector(planControls.screenRight, -((left + right) / 2 - w / 2) * perPixel)
    .addScaledVector(planControls.screenUp, ((top + bottom) / 2 - h / 2) * perPixel);
  // The camera hangs over the whole model, whatever levels are on now, so a
  // level switched on later is not cut off (the review of 2026-10-09).
  const whole = new THREE.Box3().setFromObject(model);
  planControls.height = whole.max.y + 5;
  planCamera.near = 0.05;
  planCamera.far = whole.max.y - whole.min.y + 10;
  planControls.update();
}

function fitTurn(box) {
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 0.5);
  const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (camera.aspect < 1 ? 1.25 / camera.aspect : 1.05);
  // From the house's −x side and the back, so the veranda faces us — the
  // view of before turned half round (his 2026-10-09: „на 180 3Д-то, така че
  // верандата на къщата да гледа към нас").
  const direction = new THREE.Vector3(-1, 0.8, -1.2).normalize();
  camera.near = Math.max(distance / 1000, 0.01);
  camera.far = distance * 20;
  camera.updateProjectionMatrix();
  controls.target.copy(centre);
  controls.lookFrom(centre.clone().addScaledVector(direction, distance));
  controls.update();
}

// The letters show always since the „Aa" button went (his „остави само
// бутона за начална позиция на камерата и за смяна-2д3д").
function setLetters(on) {
  changed();
  lettersOn = on;
  for (const block of blocks) for (const m of block.letters) m.visible = on;
}

function select(block) {
  changed();
  const before = selected;
  selected = block;
  if (before) look(before);
  halo();
  if (!block) { $('info').style.display = 'none'; placeLevels(); return; }
  look(block);
  $('info').style.display = 'flex';
  $('infoName').textContent = block.name;
  $('infoStage').textContent = stageName(block.stage);
  $('infoNo').textContent = numbered(block) ? `№ ${block.placement}` : 'без №';
  $('infoSwatch').style.background = block.colour ? `#${block.colour.getHexString()}` : '#ccc';
  placeLevels();
}

const loader = new GLTFLoader();

function loadBuffer(buffer, label) {
  busy('Подрежда…', 1);
  loader.parse(buffer, '', (gltf) => { busy(null); show(gltf, label); },
    (error) => { busy(null); alert(`Файлът не се отвори: ${error.message || error}`); });
}

async function loadUrl(url) {
  busy('Зарежда…', 0);
  try {
    const response = await fetch(url, { cache: 'no-cache' });
    if (!response.ok) throw new Error(response.status === 404 ? 'няма такъв модел (още ли се качва?)' : `${response.status}`);
    const total = Number(response.headers.get('content-length')) || 0;
    const reader = response.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      busy(`Зарежда… ${(got / 1048576).toFixed(1)} MB`, total ? got / total : 0);
    }
    const all = new Uint8Array(got);
    let at = 0;
    for (const c of chunks) { all.set(c, at); at += c.length; }
    loadBuffer(all.buffer, decodeURIComponent(url.split('/').pop().replace(/\.glb$/i, '')));
  } catch (error) {
    busy(null);
    $('empty').style.display = 'flex';
    alert(`Моделът не се зареди: ${error.message || error}`);
  }
}

function openFile(file) {
  if (!file) return;
  busy('Чете файла…', 0.5);
  file.arrayBuffer().then((buffer) => loadBuffer(buffer, file.name.replace(/\.glb$/i, '')));
}

// A tap (not a drag) picks a block.
const ray = new THREE.Raycaster();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8 || !model) { down = null; return; }
  down = null;
  const p = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(p, view);
  const meshes = blocks.filter((b) => b.object.visible).flatMap((b) => b.bodies.concat(b.letters.filter((m) => m.visible)));
  const hit = ray.intersectObjects(meshes, false)[0];
  // The foundation is never chosen: a tap on it lets go, as a tap on the
  // empty screen does — and a panel behind it is not reached through it (his
  // 2026-10-09: „фундамента да не може да се селектира").
  const block = hit ? blockOf(hit.object) : null;
  quench();
  select(block && block.stage !== 'B' ? block : null);
});

// A file from the phone: the big button on the empty page (and a file dropped
// on it on a computer).
$('btnOpenBig').onclick = () => $('file').click();
$('file').onchange = (e) => openFile(e.target.files[0]);
$('btnFit').onclick = () => fit();
$('btn2d').onclick = () => setFlat(!flat);
$('btnPrev').onclick = () => move(-1);
$('btnNext').onclick = () => move(1);
$('stepRange').oninput = (e) => setStep(Number(e.target.value), true);

// Any button pressed, or the step slider moved, puts the chosen panel's card
// away and lets the panel go (his 2026-10-09: „когато селектираш панел и се
// появи инфо за него който и бутон да цъкнеш да скрива информацията").
document.addEventListener('click', (e) => {
  if (!e.target.closest || !e.target.closest('button')) return;
  if (selected) select(null);
  // Any button but ◀ ▶ puts the newest panel's green out; ◀ ▶ light it again
  // on the last one standing (his 2026-10-09: „ако цъкнеш някъде в страни или
  // друг бутон или избереш панел да изгасва. Ако пак цъкнеш стрелка или
  // слайдер пак да се появявя зеленкото на последния панел").
  if (!e.target.closest('#btnPrev, #btnNext')) quench();
}, true);
$('stepRange').addEventListener('input', () => { if (selected) select(null); });

for (const name of ['dragenter', 'dragover']) {
  window.addEventListener(name, (e) => { e.preventDefault(); $('empty').classList.add('drag'); });
}
window.addEventListener('dragleave', () => $('empty').classList.remove('drag'));
window.addEventListener('drop', (e) => {
  e.preventDefault();
  $('empty').classList.remove('drag');
  openFile(e.dataTransfer.files[0]);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  placeLevels();
});

// Nothing of the page scrolls or zooms under the finger but the stage chips
// and the step slider.
document.addEventListener('touchmove', (e) => {
  if (!(e.target.closest && e.target.closest('input[type=range]'))) e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

// Opened inside an app (Viber and the like): off to the real browser. On
// Android the page goes over to Chrome by itself, once; on an iPhone a page
// cannot leave by itself — the button asks Safari (iOS 17+) to take it.
const ua = navigator.userAgent;
const android = /Android/i.test(ua);
const ios = /iPhone|iPad|iPod/i.test(ua);
const inApp = /Viber|FBAN|FBAV|Instagram|Line\/|Telegram|WhatsApp|Snapchat|; wv\)/i.test(ua) || (ios && !/Safari\//.test(ua));
function toBrowser() {
  if (android) {
    location.href = `intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(location.href)};end`;
  } else if (ios) {
    location.href = `x-safari-${location.href}`;
  }
}
if (inApp) {
  $('inapp').style.display = 'block';
  $('btnBrowser').onclick = toBrowser;
  $('btnStay').onclick = () => { $('inapp').style.display = 'none'; };
  let tried = false;
  try { tried = sessionStorage.getItem('mn-to-browser') === '1'; sessionStorage.setItem('mn-to-browser', '1'); } catch (e) { /* no storage */ }
  if (android && !tried) toBrowser();
}

// Shade in the corners (ambient occlusion), always on — while the model turns
// too. His 2026-10-09: „сложи нещо като амбиент оклужан … ако не е тежко за 3-4
// годишни андроид телефони", then „в момента в който спра да мърдам екрана и
// той зареди линиите стават пикселизирани, нее добре … не е тежка геометрията
// мисля че може да се направи постоянно да е вклучен".
// The lines went jagged because the shaded picture was drawn without
// smoothing of edges and at a lower resolution than the plain one; now the
// picture is drawn smoothed (up to 4 samples) and at the screen's own
// resolution, the shading too. (For an hour on 2026-10-09 the shading was
// worked out at half the resolution, on a guess that it made the fingers
// „една идея по нервно" — measured by nobody; his „кой е казал че са тежки",
// and back.) `?ao=0` in the link draws without the shading — to compare on
// a phone. A phone that cannot keep up — under about 14 pictures a second while the
// model turns — shades only when the model stands still (a quarter of a
// second after it stops), for the rest of the visit; one that takes over
// 400 ms for a single shaded picture is spared the shading altogether. A
// picture in which new shaders were made is not counted (the review of
// 2026-10-09). ORIGIN unasked — the guards and their numbers, `?ao=0`.
let composer = null;
let renderPass = null;
let gtao = null;
let outline = null;         // the halo round the newest panel
let outlinePicked = null;   // the halo round the chosen one
let occlusion = true;
let shadeWhileMoving = true;
try {
  // The shading needs WebGL 2 and pictures in half floats; without them the
  // picture is drawn plain. The smoothing takes what the graphics chip gives
  // for such pictures, up to 4.
  if (new URLSearchParams(location.search).get('ao') === '0') throw new Error('asked plain');
  if (!renderer.capabilities.isWebGL2 || !renderer.extensions.has('EXT_color_buffer_float')) throw new Error('no float targets');
  const gl = renderer.getContext();
  const counts = gl.getInternalformatParameter(gl.RENDERBUFFER, gl.RGBA16F, gl.SAMPLES);
  const samples = counts && counts.length ? Math.min(4, Math.max(...counts)) : 0;
  const target = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples });
  composer = new EffectComposer(renderer, target);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(window.innerWidth, window.innerHeight);
  renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);
  gtao = new GTAOPass(scene, camera, window.innerWidth, window.innerHeight);
  gtao.blendIntensity = 0.9;
  gtao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.5, thickness: 1, scale: 1, samples: 12 });
  composer.addPass(gtao);
  // A wide soft halo, fading outwards (his „с намалящ градиент"): green
  // round the newest panel, blue round the chosen one (his „и селектирания го
  // направи така да става").
  const ring = (near, far) => {
    const pass = new OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera, []);
    pass.visibleEdgeColor.set(near);
    pass.hiddenEdgeColor.set(far);
    pass.edgeStrength = 3;
    pass.edgeGlow = 2;
    pass.edgeThickness = 4;
    composer.addPass(pass);
    return pass;
  };
  outline = ring(0x3dff7a, 0x1a7a3a);
  outlinePicked = ring(0x4d8dff, 0x1a3a8a);
  composer.addPass(new OutputPass());
} catch (error) {
  composer = null;
}
window.addEventListener('resize', () => { if (composer) composer.setSize(window.innerWidth, window.innerHeight); });

// The shading follows the camera the picture is drawn with. (Its camera kind
// switch is not touched: in three.js 0.160 the shading reads depth through
// the camera's own projection, for the flat 2D camera too — the review of
// 2026-10-09.)
function aim(cam) {
  if (!composer) return;
  renderPass.camera = cam;
  gtao.camera = cam;
  // A halo reads depth by the camera's kind, fixed when its mask material
  // is made — made again for the other kind.
  for (const pass of [outline, outlinePicked]) {
    if (pass.renderCamera === cam) continue;
    pass.renderCamera = cam;
    const mask = pass.getPrepareMaskMaterial();
    mask.side = THREE.DoubleSide;
    mask.fragmentShader = mask.fragmentShader.replace(/DEPTH_TO_VIEW_Z/g, `${cam.isPerspectiveCamera ? 'perspective' : 'orthographic'}DepthToViewZ`);
    pass.prepareMaskMaterial.dispose();
    pass.prepareMaskMaterial = mask;
  }
}

// The green halo goes round the newest panel, unless it is the chosen one;
// the blue one round the chosen panel.
function halo() {
  if (!outline) return;
  outline.selectedObjects = newest && newest !== selected ? newest.bodies : [];
  outlinePicked.selectedObjects = selected ? selected.bodies : [];
}

// The newest panel's green goes out — a tap anywhere on the model or the
// empty screen, a choice, any other button. ◀ ▶ and the slider light it again.
function quench() {
  if (!newest) return;
  const was = newest;
  newest = null;
  changed();
  look(was);
  halo();
}

// 2D on and off. Each view keeps where it was; the levels and the step stay
// as they are. The button names the view it goes to: „2D" in 3D, „3D" in 2D
// (his 2026-10-09: „като цъкнеш на 2д и вече си в 2д от горе на бутона да
// пише 3Д").
function setFlat(on) {
  changed();
  flat = on;
  $('btn2d').textContent = on ? '3D' : '2D';
  $('btn2d').title = on ? '3D — обратно към въртенето' : '2D — етажите отгоре';
  $('btn2d').setAttribute('aria-label', on ? '3D изглед' : '2D изглед отгоре');
  controls.enabled = !on;
  planControls.enabled = on;
  controls.pointers.clear();
  planControls.pointers.clear();
  view = on ? planCamera : camera;
  aim(view);
  for (const b of blocks) look(b);
}

let version = 0;           // anything on the page that changes the picture
const lastCamera = new THREE.Matrix4();
const lastProjection = new THREE.Matrix4();
let lastVersion = -1;
let stillSince = performance.now();
let shaded = false;
let paceLast = 0;
let paceSum = 0;
let paceCount = 0;
function changed() { version += 1; }

// Draws the picture; true when new shaders were made for it (slow once, not
// a slow phone).
function draw(shade) {
  const programs = () => (renderer.info.programs ? renderer.info.programs.length : 0);
  const before = programs();
  if (!shade) { renderer.render(scene, view); return programs() !== before; }
  const started = performance.now();
  composer.render();
  const made = programs() !== before;
  if (!made && performance.now() - started > 400) occlusion = false;
  return made;
}

// How fast the shaded pictures follow each other while the model moves.
function pace(shade, now, made) {
  if (!shade || made) { paceLast = 0; return; }
  // A gap of a second is a pause (the page was in the background), not a
  // slow picture.
  if (paceLast && now - paceLast < 1000) { paceSum += now - paceLast; paceCount += 1; }
  paceLast = now;
  if (paceCount < 30) return;
  if (paceSum / paceCount > 70) shadeWhileMoving = false;
  paceSum = 0;
  paceCount = 0;
}

renderer.setAnimationLoop((now) => {
  const active = flat ? planControls : controls;
  active.update();
  view.updateMatrixWorld();
  // A finger resting on the screen without moving draws nothing new.
  const moving = !lastCamera.equals(view.matrixWorld) ||
    !lastProjection.equals(view.projectionMatrix) || version !== lastVersion;
  if (moving) {
    lastCamera.copy(view.matrixWorld);
    lastProjection.copy(view.projectionMatrix);
    lastVersion = version;
    stillSince = now;
    const shade = !!composer && occlusion && shadeWhileMoving;
    pace(shade, now, draw(shade));
    shaded = shade;
    return;
  }
  pace(false, now, false);
  if (shaded || !composer || !occlusion || now - stillSince < 250) return;
  draw(true);
  shaded = true;
});

// The page over the whole screen — no address bar, no reload button (his
// 2026-10-10: „ако можеш да я направиш да е на цяла страница а не отдолу да
// пише адрес и релоуд"). A browser lets a page go full screen only on a
// touch, so a touch lifted does it — the first one, and the next one after
// the phone has left full screen. Android does it; an iPhone's Safari does
// not for a page; on a computer nothing changes.
document.addEventListener('pointerup', (e) => {
  const page = document.documentElement;
  if (e.pointerType !== 'touch' || document.fullscreenElement || !page.requestFullscreen) return;
  page.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
}, true);

// A newer page on the server: the phone keeps the old one up to 10 minutes
// for an old link. Looked up once at opening; when there is a newer one, the
// page opens it at once, once per version (his 2026-10-10 „да" to the
// question whether the page should check for a new version by itself).
// `PAGE_VERSION` is written in at publishing (`tools/publish_viewer.py`); the
// source here keeps the placeholder and checks nothing.
const PAGE_VERSION = 'fdbe9879134b';
(async () => {
  if (PAGE_VERSION.startsWith('__')) return;
  try {
    const response = await fetch(`${location.pathname}?check=${Date.now()}`, { cache: 'no-store' });
    const there = /const PAGE_VERSION = '([0-9a-f]+)'/.exec(await response.text());
    if (!there || there[1] === PAGE_VERSION) return;
    if (sessionStorage.getItem('mn-page-version') === there[1]) return;
    sessionStorage.setItem('mn-page-version', there[1]);
    const next = new URL(location.href);
    next.searchParams.set('v', there[1]);
    location.replace(next.toString());
  } catch (error) { /* offline or no storage: the page as it is */ }
})();

// ?m=house opens models/house.glb straight from the link — only a name from
// this page's own models/, never another site.
const wanted = new URLSearchParams(location.search).get('m');
if (wanted && /^[A-Za-z0-9._-]+$/.test(wanted)) {
  $('empty').style.display = 'none';
  loadUrl(`models/${wanted.replace(/\.glb$/i, '')}.glb`);
}
</script>
</body>
</html>
