<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a36">
<title>Монтажна схема</title>
<meta name="description" content="Монтажна схема на панелите — 3D, на телефона.">
<style>
  :root {
    --ink: #1f2a36;
    --muted: #5d6b7a;
    --paper: #eef1f4;
    --card: #ffffff;
    --line: #d5dbe1;
    --accent: #2f6fd6;
    --shadow: 0 6px 24px rgba(20, 30, 45, .16);
  }
  * { box-sizing: border-box; }
  /* The page never moves under the finger — not in Safari, not inside Viber's
     own browser (his 2026-10-09: „стои като допълнителен прозорец който се
     мести нагоре и надолу при опит за завъртане на 3дто"). */
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden;
    overscroll-behavior: none; touch-action: none; position: fixed; inset: 0; width: 100%; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; touch-action: none; }
  #inapp { display: none; position: fixed; left: 16px; right: 16px; top: calc(120px + env(safe-area-inset-top));
    background: #fff7d6; border: 1px solid #e8c95a; border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); z-index: 5; }
  #inapp p { margin: 0 0 8px; }
  #inapp .row { display: flex; gap: 8px; }
  #inapp button { flex: 1; box-shadow: none; font-size: 16px; }
  /* Made for the phone first (his 2026-10-09: „страницата трябва да е най вече
     за телефон пригодена"): every control a thumb's size, nothing that needs
     a mouse, no zoom on a double tap, no text picked up by a long press. */
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--card);
    border-radius: 14px; padding: 0 14px; min-height: 48px; min-width: 48px; cursor: pointer; box-shadow: var(--shadow);
    touch-action: manipulation; font-size: 17px; }
  button:active { transform: translateY(1px); }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .top { position: fixed; top: 0; left: 0; right: 0; padding: calc(10px + env(safe-area-inset-top)) 16px 0;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .title { flex: 1; min-width: 0; background: rgba(255,255,255,.9); border-radius: 12px; padding: 6px 12px;
    box-shadow: var(--shadow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title b { display: block; overflow: hidden; text-overflow: ellipsis; }
  .title small { color: var(--muted); }
  /* The levels, one above the other, storey 1 at the bottom; each a little
     house lit green as far up as it shows (his 2026-10-09). */
  #levels { position: fixed; left: 16px; bottom: calc(150px + env(safe-area-inset-bottom)); display: none;
    flex-direction: column-reverse; gap: 4px; z-index: 2; padding: 6px; border-radius: 22px;
    background: rgba(255,255,255,.78); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 8px 28px rgba(20,30,45,.18), inset 0 0 0 1px rgba(255,255,255,.6); }
  #levels button { padding: 6px 8px; min-width: 60px; min-height: 58px; border: 0; border-radius: 16px;
    background: transparent; box-shadow: none; transition: background .15s, transform .1s; }
  #levels button:active { transform: scale(.95); }
  #levels button.on { background: #e6f8ee; box-shadow: inset 0 0 0 2px #10b981; color: var(--ink); }
  #levels svg { display: block; margin: 0 auto; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .bottom > * { pointer-events: auto; }
  .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 14px; }
  #info { display: none; align-items: center; gap: 10px; }
  #info .swatch { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.2); flex: none; }
  #info .name { min-width: 0; }
  #info b { font-size: 18px; display: block; }
  #info small { color: var(--muted); }
  #info .no { margin-left: auto; font-size: 22px; font-weight: 700; white-space: nowrap; }
  #steps { display: none; }
  #steps input[type=range] { display: block; width: 100%; height: 40px; margin: 0; accent-color: var(--accent); touch-action: manipulation; }
  #steps .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #steps .row button { box-shadow: none; font-size: 20px; }
  #steps .what { color: var(--muted); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #steps .what b { color: var(--ink); }
  #empty { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  #empty .card { max-width: 420px; text-align: center; padding: 24px 20px; }
  #empty h1 { font-size: 20px; margin: 0 0 8px; }
  #empty p { color: var(--muted); margin: 0 0 16px; }
  #empty.drag .card { outline: 3px dashed var(--accent); outline-offset: 6px; }
  #busy { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  #busy .card { min-width: 220px; text-align: center; }
  #busy .meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  #busy .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  #file { display: none; }
  @media (min-width: 720px) {
    .bottom { left: 50%; right: auto; transform: translateX(-50%); width: 640px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>

<div class="top">
  <div class="bar">
    <div class="title" id="title"><b>Монтажна схема</b><small>няма отворен модел</small></div>
    <button id="btnLetters" class="on" title="Надписите" aria-label="Надписи">Aa</button>
    <button id="btnFit" title="Начален изглед" aria-label="Начален изглед">⌂</button>
    <button id="btnFull" title="Цял екран" aria-label="Цял екран" hidden>⛶</button>
    <button id="btnOpen" title="Отвори файл" aria-label="Отвори файл">📂</button>
  </div>
</div>

<div id="levels"></div>

<div class="bottom">
  <div class="card" id="info">
    <span class="swatch" id="infoSwatch"></span>
    <span class="name"><b id="infoName"></b><small id="infoStage"></small></span>
    <span class="no" id="infoNo"></span>
  </div>
  <div class="card" id="steps">
    <div class="what" id="stepWhat"></div>
    <input type="range" id="stepRange" min="0" max="0" value="0" aria-label="Стъпка на монтажа">
    <div class="row">
      <button id="btnPrev" aria-label="Назад">◀</button>
      <button id="btnNext" aria-label="Напред">▶</button>
    </div>
  </div>
</div>

<div id="empty">
  <div class="card">
    <h1>Монтажна схема</h1>
    <p>Отвори файла <b>.glb</b>, записан от SketchUp (MN Assembly). Въртиш с пръст, приближаваш с два пръста, цъкаш панел, за да видиш името и номера му.</p>
    <button id="btnOpenBig">📂 Отвори файл</button>
  </div>
</div>

<div id="inapp">
  <p><b>Отвори в браузъра</b> — тук, вътре в приложението, страницата не се върти добре.</p>
  <div class="row"><button id="btnBrowser">Отвори в браузъра</button><button id="btnStay">Остани</button></div>
</div>

<div id="busy"><div class="card"><div id="busyText">Зарежда…</div><div class="meter"><i id="busyBar"></i></div></div></div>
<input type="file" id="file" accept=".glb,model/gltf-binary">

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = (id) => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 5000);
camera.position.set(20, 15, 20);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a96a3, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.6, 1, 0.4);
scene.add(sun);

// Turned round the vertical, so the horizon stays where it is, and tilted up,
// over the top and on, with no stop at the pole. His 2026-10-09: „не ми
// харесва това че 3дто спира да се върти в изглед отгоре", and after a
// trackball that turned the house like a ball: „исках просто да махнеш
// полуса", then „трябва да има някакъв пивот а не да хвърчи къщата": no
// glide after the finger lets go. And „с двата пръста като слайдвам да е
// мове … зума да е като в скетчъпа. където зумнеш на там да отива
// камерата": two fingers pinch and move; a zoom goes towards the point under
// the fingers (or the mouse) — the panel there stays under them and the
// pivot comes along. One finger turns; the mouse: drag turns, the wheel
// zooms where it points, right drag (or Shift) moves.
class TurnControls {
  constructor(camera, element) {
    this.camera = camera;
    this.element = element;
    this.target = new THREE.Vector3();
    this.theta = 0;      // round the vertical
    this.phi = 0.4;      // up and over, no limit
    this.radius = 10;
    this.pointers = new Map();
    this.pinch = null;
    element.addEventListener('pointerdown', (e) => this.down(e));
    element.addEventListener('pointermove', (e) => this.move(e));
    element.addEventListener('pointerup', (e) => this.up(e));
    element.addEventListener('pointercancel', (e) => this.up(e));
    element.addEventListener('wheel', (e) => { e.preventDefault(); this.zoomAt(Math.exp(e.deltaY * 0.001), e.clientX, e.clientY); }, { passive: false });
    this.pick = null;   // (x, y) => the model's point under the screen point, or null
    element.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  lookFrom(position) {
    const d = position.clone().sub(this.target);
    this.radius = d.length();
    this.phi = Math.asin(THREE.MathUtils.clamp(d.y / this.radius, -1, 1));
    this.theta = Math.atan2(d.x, d.z);
  }
  down(e) {
    this.element.setPointerCapture(e.pointerId);
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button });
    this.pinch = null;
  }
  up(e) {
    this.pointers.delete(e.pointerId);
    this.pinch = null;
  }
  move(e) {
    const p = this.pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x;
    const dy = e.clientY - p.y;
    p.x = e.clientX;
    p.y = e.clientY;
    if (this.pointers.size === 1) {
      if (p.button === 2 || e.shiftKey) { this.pan(dx, dy); return; }
      const speed = (2 * Math.PI) / Math.max(this.element.clientHeight, 1);
      const upright = Math.cos(this.phi) >= 0 ? 1 : -1;  // over the top, left stays left
      this.theta -= dx * speed * upright;
      this.phi += dy * speed;
    } else if (this.pointers.size === 2) {
      const [a, b] = [...this.pointers.values()];
      const span = Math.hypot(a.x - b.x, a.y - b.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (this.pinch && span > 0) {
        this.zoomAt(this.pinch.span / span, mid.x, mid.y);
        this.pan(mid.x - this.pinch.mid.x, mid.y - this.pinch.mid.y);
      }
      this.pinch = { span, mid };
    }
  }
  pan(dx, dy) {
    const scale = (2 * this.radius * Math.tan(THREE.MathUtils.degToRad(this.camera.fov / 2))) / Math.max(this.element.clientHeight, 1);
    const right = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 1);
    this.target.addScaledVector(right, -dx * scale).addScaledVector(up, dy * scale);
  }
  zoom(factor) {
    this.radius = THREE.MathUtils.clamp(this.radius * factor, 0.2, 5000);
  }
  // Towards the point under (x, y): the model's surface there, or the plane
  // of the pivot. Camera and pivot close in on it together, so it stays
  // where it is on the screen.
  zoomAt(factor, x, y) {
    const next = THREE.MathUtils.clamp(this.radius * factor, 0.2, 5000);
    const f = next / this.radius;
    let point = this.pick ? this.pick(x, y) : null;
    if (!point) {
      const rect = this.element.getBoundingClientRect();
      const ndc = new THREE.Vector2(((x - rect.left) / rect.width) * 2 - 1, -((y - rect.top) / rect.height) * 2 + 1);
      const caster = new THREE.Raycaster();
      caster.setFromCamera(ndc, this.camera);
      const facing = this.target.clone().sub(this.camera.position).normalize();
      const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(facing, this.target);
      point = caster.ray.intersectPlane(plane, new THREE.Vector3());
    }
    if (point) this.target.sub(point).multiplyScalar(f).add(point);
    this.radius = next;
  }
  update() {
    const c = Math.cos(this.phi);
    const s = Math.sin(this.phi);
    const towards = new THREE.Vector3(c * Math.sin(this.theta), s, c * Math.cos(this.theta));
    this.camera.position.copy(this.target).addScaledVector(towards, this.radius);
    this.camera.up.set(-s * Math.sin(this.theta), c, -s * Math.cos(this.theta));
    this.camera.lookAt(this.target);
  }
}
const controls = new TurnControls(camera, renderer.domElement);
controls.pick = (x, y) => {
  if (!model) return null;
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((x - rect.left) / rect.width) * 2 - 1, -((y - rect.top) / rect.height) * 2 + 1);
  const caster = new THREE.Raycaster();
  caster.setFromCamera(ndc, camera);
  const hit = caster.intersectObjects(blocks.filter((b) => b.object.visible).flatMap((b) => b.bodies), false)[0];
  return hit ? hit.point : null;
};

// The stages of the assembly, as the plugin writes them (S1 storey 1 with the
// stair, F the floor, S2 storey 2, R the roof).
function stageName(key) {
  const storey = /^S(\d+)$/.exec(key || '');
  if (storey) return `Етаж ${storey[1]}`;
  return { F: 'Под', R: 'Покрив', B: 'Основа' }[key] || key || 'Други';
}

let model = null;
let blocks = [];          // { object, name, placement, stage, stageOrder, bodies, letters, colour }
let stages = [];          // [{ key, order, on }]
let levels = [];          // the stages with a button, bottom up (the foundation has none)
let upTo = 0;             // the highest level shown
let sequence = [];        // the blocks of the stages that are on, in the order they go up
let step = null;          // index in sequence, or null = everything
let lettersOn = true;
let selected = null;

const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x1f2a36, transparent: true, opacity: 0.55 });

const isLetters = (mesh) => ((mesh.material && mesh.material.name) || '').toLowerCase().startsWith('mn assembly letters');
const numbered = (b) => Number.isInteger(b.placement);

function busy(text, part) {
  $('busy').style.display = text ? 'flex' : 'none';
  if (text) $('busyText').textContent = text;
  $('busyBar').style.width = `${Math.round((part || 0) * 100)}%`;
}

function clear() {
  if (!model) return;
  scene.remove(model);
  model.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  model = null;
  blocks = [];
  selected = null;
}

function blockOf(object) {
  for (let o = object; o; o = o.parent) {
    const found = blocks.find((b) => b.object === o);
    if (found) return found;
  }
  return null;
}

function show(gltf, label) {
  select(null);
  clear();
  model = gltf.scene;
  model.traverse((o) => {
    const data = o.userData || {};
    if (data.name !== undefined && data.colour !== undefined) {
      blocks.push({
        object: o, name: data.name, placement: data.placement ?? null,
        stage: data.stage || 'S1', stageOrder: Number.isFinite(data.stage_order) ? data.stage_order : 1,
        bodies: [], letters: []
      });
    }
  });
  for (const block of blocks) {
    block.object.traverse((o) => {
      if (!o.isMesh) return;
      o.material = o.material.clone();   // its own material: lighting one block lights only it
      if (isLetters(o)) {
        block.letters.push(o);
      } else {
        block.bodies.push(o);
        block.colour = o.material.color.clone();
        o.add(new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 25), edgeMaterial));
      }
    });
  }
  scene.add(model);
  const extras = (gltf.scenes && gltf.scenes[0] && gltf.scenes[0].userData) || {};
  const b = document.createElement('b');
  b.textContent = extras.title || label || 'Монтажна схема';
  const s = document.createElement('small');
  s.textContent = `${blocks.length} елемента${extras.exported ? ' · ' + extras.exported : ''}`;
  $('title').replaceChildren(b, s);

  const keys = new Map();
  for (const x of blocks) if (!keys.has(x.stage)) keys.set(x.stage, x.stageOrder);
  stages = [...keys].map(([key, order]) => ({ key, order, on: true })).sort((p, q) => p.order - q.order);
  levels = stages.filter((st) => st.key !== 'B');
  upTo = levels.length - 1;
  const column = $('levels');
  column.replaceChildren(...levels.map((st, i) => {
    const button = document.createElement('button');
    button.innerHTML = houseIcon(levels, i);
    button.title = stageName(st.key);
    button.setAttribute('aria-label', stageName(st.key));
    // Pressed again, the level goes too and the one under it stays (his
    // „като натиснеш още един път първия етаж да се скрива и той" — then only
    // the foundation is left).
    button.onclick = () => showUpTo(i === upTo ? i - 1 : i);
    return button;
  }));
  column.style.display = levels.length > 1 ? 'flex' : 'none';
  markLevels();

  $('empty').style.display = 'none';
  setLetters(lettersOn);
  restage();
  fit();
}

// A level shows itself and everything under it, and hides what is above —
// storey 1; then storey 1 and the floor; then the second storey on them; the
// roof shows all. The foundation stands always. His 2026-10-09: „ако цъкнеш
// едно не скрива едно а скрива всичко останало, ако цъкнеш флор показва 1
// плус флор ако цъкнеш етаж две - 1+ флор + 2 и така на татък".
function showUpTo(i) {
  upTo = i;
  for (const st of stages) st.on = st.key === 'B' || levels.indexOf(st) <= i;
  markLevels();
  restage(i < 0 ? 0 : null);
}

// The column stands over the cards at the bottom, however high they are —
// the name card of a picked block comes and goes (his 2026-10-09: „измести
// бутоните малко нагоре защото се бият с наименованието на модула").
function placeLevels() {
  const cards = document.querySelector('.bottom');
  $('levels').style.bottom = `${Math.round(cards.getBoundingClientRect().height) + 8}px`;
}

function markLevels() {
  [...$('levels').children].forEach((button, i) => button.classList.toggle('on', i === upTo));
}

// The little house of a level button: one band a storey (with its windows),
// a thin slab a floor, a gable with a chimney the roof, bottom up; green as
// far as the button shows, the rest grey (his 2026-10-09, then „и ги направи
// малко по-готини").
let iconCount = 0;
function houseIcon(list, lit) {
  const id = `h${iconCount += 1}`;
  const width = 44;
  const sizes = { storey: 12, slab: 3.5, roof: 13 };
  const kinds = list.map((st) => (st.key === 'R' ? 'roof' : (st.key === 'F' ? 'slab' : 'storey')));
  const total = kinds.reduce((sum, kind) => sum + sizes[kind], 0) + 3;
  let y = total - 1.5;
  const defs = `<defs>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="${id}r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4a0"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="${id}o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e7eb"/><stop offset="1" stop-color="#c3cad2"/></linearGradient>
  </defs>`;
  const shapes = kinds.map((kind, i) => {
    const h = sizes[kind];
    const top = y - h;
    y = top;
    const on = i <= lit;
    const edge = on ? '#065f46' : '#8a96a3';
    if (kind === 'roof') {
      const fill = on ? `url(#${id}r)` : `url(#${id}o)`;
      return `<rect x="${width * 0.66}" y="${top + 1}" width="4" height="7" rx="0.8" fill="${on ? '#065f46' : '#aab3bc'}"/>` +
        `<polygon points="2,${top + h} ${width - 2},${top + h} ${width / 2},${top}" fill="${fill}" stroke="${edge}" stroke-width="1" stroke-linejoin="round"/>`;
    }
    if (kind === 'slab') {
      return `<rect x="4" y="${top}" width="${width - 8}" height="${h}" rx="1" fill="${on ? '#047857' : '#aab3bc'}"/>`;
    }
    const fill = on ? `url(#${id}g)` : `url(#${id}o)`;
    const glass = on ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.7)';
    return `<rect x="7" y="${top}" width="${width - 14}" height="${h}" rx="1.6" fill="${fill}" stroke="${edge}" stroke-width="1"/>` +
      `<rect x="13" y="${top + 3.5}" width="5" height="5" rx="0.8" fill="${glass}"/>` +
      `<rect x="${width - 18}" y="${top + 3.5}" width="5" height="5" rx="0.8" fill="${glass}"/>`;
  });
  return `<svg viewBox="0 0 ${width} ${total}" width="${width}" height="${Math.round(total * 1.05)}" aria-hidden="true">${defs}${shapes.join('')}</svg>`;
}

// The order the blocks go up: by placement number; the ones without a number
// after them, stage by stage, by name. ORIGIN unasked 2026-10-09 — his „като
// натискаш бутон напред се добавят всеки следващ панел"; the order without
// numbers is the assistant's.
//
// The steps count how many of them stand: 0 … all. With every level hidden
// the steps stay, at 0, over the first storey's blocks — „▶" puts them up one
// by one from the bare foundation (his 2026-10-09: „лентата за скрол и
// стрелките да не се скриват с първия етаж. просто да стоят на 0 когато е
// скрит").
let shown = 0;

function restage(count = null) {
  const on = new Set(stages.filter((st) => st.on).map((st) => st.key));
  if (upTo < 0 && levels.length) on.add(levels[0].key);
  sequence = blocks.filter((b) => on.has(b.stage) && b.stage !== 'B').sort((p, q) =>
    (numbered(p) ? 0 : 1) - (numbered(q) ? 0 : 1) ||
    (p.placement ?? 0) - (q.placement ?? 0) ||
    p.stageOrder - q.stageOrder ||
    p.name.localeCompare(q.name, 'bg', { numeric: true }));
  $('steps').style.display = blocks.some((b) => b.stage !== 'B') ? 'block' : 'none';
  placeLevels();
  $('stepRange').min = 0;
  $('stepRange').max = sequence.length;
  setStep(count === null ? sequence.length : count);
}

function light(block, on) {
  for (const m of block.bodies) m.material.emissive.setHex(on ? 0x553300 : 0x000000);
}

// count: how many of the sequence stand (0 … all); the last one put up is lit
// while stepping.
function setStep(count) {
  shown = Math.min(Math.max(count, 0), sequence.length);
  step = shown < sequence.length ? shown - 1 : null;
  for (const b of blocks) {
    const at = sequence.indexOf(b);
    b.object.visible = b.stage === 'B' || (at >= 0 && at < shown);
    light(b, false);
  }
  if (step !== null && step >= 0) light(sequence[step], true);
  if (selected) {
    if (selected.object.visible) light(selected, true); else select(null);
  }
  $('stepRange').value = shown;
  if (shown === sequence.length && shown > 0) {
    $('stepWhat').textContent = `Видими: ${sequence.length}. „◀" маха, „▶" добавя по един.`;
  } else if (shown === 0) {
    $('stepWhat').textContent = `0 от ${sequence.length}. „▶" добавя по един.`;
  } else {
    const b = sequence[shown - 1];
    const t = document.createElement('span');
    t.textContent = `Стъпка ${shown} от ${sequence.length}: `;
    const n = document.createElement('b');
    n.textContent = `${numbered(b) ? `№ ${b.placement} · ` : ''}${b.name}`;
    $('stepWhat').replaceChildren(t, n);
  }
}

function move(delta) {
  setStep(shown + delta);
}

function fit() {
  if (!model) return;
  const box = new THREE.Box3();
  for (const block of blocks) if (block.object.visible) box.expandByObject(block.object);
  if (box.isEmpty()) box.setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 0.5);
  const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (camera.aspect < 1 ? 1.25 / camera.aspect : 1.05);
  const direction = new THREE.Vector3(1, 0.8, 1.2).normalize();
  camera.near = Math.max(distance / 1000, 0.01);
  camera.far = distance * 20;
  camera.updateProjectionMatrix();
  controls.target.copy(centre);
  controls.lookFrom(centre.clone().addScaledVector(direction, distance));
  controls.update();
}

function setLetters(on) {
  lettersOn = on;
  $('btnLetters').classList.toggle('on', on);
  for (const block of blocks) for (const m of block.letters) m.visible = on;
}

function select(block) {
  if (selected) light(selected, false);
  if (step !== null && sequence[step]) light(sequence[step], true);
  selected = block;
  if (!block) { $('info').style.display = 'none'; placeLevels(); return; }
  light(block, true);
  $('info').style.display = 'flex';
  $('infoName').textContent = block.name;
  $('infoStage').textContent = stageName(block.stage);
  $('infoNo').textContent = numbered(block) ? `№ ${block.placement}` : 'без №';
  $('infoSwatch').style.background = block.colour ? `#${block.colour.getHexString()}` : '#ccc';
  placeLevels();
}

const loader = new GLTFLoader();

function loadBuffer(buffer, label) {
  busy('Подрежда…', 1);
  loader.parse(buffer, '', (gltf) => { busy(null); show(gltf, label); },
    (error) => { busy(null); alert(`Файлът не се отвори: ${error.message || error}`); });
}

async function loadUrl(url) {
  busy('Зарежда…', 0);
  try {
    const response = await fetch(url, { cache: 'no-cache' });
    if (!response.ok) throw new Error(response.status === 404 ? 'няма такъв модел (още ли се качва?)' : `${response.status}`);
    const total = Number(response.headers.get('content-length')) || 0;
    const reader = response.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      busy(`Зарежда… ${(got / 1048576).toFixed(1)} MB`, total ? got / total : 0);
    }
    const all = new Uint8Array(got);
    let at = 0;
    for (const c of chunks) { all.set(c, at); at += c.length; }
    loadBuffer(all.buffer, decodeURIComponent(url.split('/').pop().replace(/\.glb$/i, '')));
  } catch (error) {
    busy(null);
    $('empty').style.display = 'flex';
    alert(`Моделът не се зареди: ${error.message || error}`);
  }
}

function openFile(file) {
  if (!file) return;
  busy('Чете файла…', 0.5);
  file.arrayBuffer().then((buffer) => loadBuffer(buffer, file.name.replace(/\.glb$/i, '')));
}

// A tap (not a drag) picks a block.
const ray = new THREE.Raycaster();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8 || !model) { down = null; return; }
  down = null;
  const p = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(p, camera);
  const meshes = blocks.filter((b) => b.object.visible).flatMap((b) => b.bodies.concat(b.letters.filter((m) => m.visible)));
  const hit = ray.intersectObjects(meshes, false)[0];
  select(hit ? blockOf(hit.object) : null);
});

// Full screen where the phone allows it (Android does; an iPhone's Safari does
// not for a page — there the button stays hidden).
if (document.documentElement.requestFullscreen) {
  $('btnFull').hidden = false;
  $('btnFull').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
}
$('btnOpen').onclick = () => $('file').click();
$('btnOpenBig').onclick = () => $('file').click();
$('file').onchange = (e) => openFile(e.target.files[0]);
$('btnFit').onclick = fit;
$('btnLetters').onclick = () => setLetters(!lettersOn);
$('btnPrev').onclick = () => move(-1);
$('btnNext').onclick = () => move(1);
$('stepRange').oninput = (e) => setStep(Number(e.target.value));

for (const name of ['dragenter', 'dragover']) {
  window.addEventListener(name, (e) => { e.preventDefault(); $('empty').classList.add('drag'); });
}
window.addEventListener('dragleave', () => $('empty').classList.remove('drag'));
window.addEventListener('drop', (e) => {
  e.preventDefault();
  $('empty').classList.remove('drag');
  openFile(e.dataTransfer.files[0]);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  placeLevels();
});

// Nothing of the page scrolls or zooms under the finger but the stage chips
// and the step slider.
document.addEventListener('touchmove', (e) => {
  if (!(e.target.closest && e.target.closest('input[type=range]'))) e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

// Opened inside an app (Viber and the like): off to the real browser. On
// Android the page goes over to Chrome by itself, once; on an iPhone a page
// cannot leave by itself — the button asks Safari (iOS 17+) to take it.
const ua = navigator.userAgent;
const android = /Android/i.test(ua);
const ios = /iPhone|iPad|iPod/i.test(ua);
const inApp = /Viber|FBAN|FBAV|Instagram|Line\/|Telegram|WhatsApp|Snapchat|; wv\)/i.test(ua) || (ios && !/Safari\//.test(ua));
function toBrowser() {
  if (android) {
    location.href = `intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(location.href)};end`;
  } else if (ios) {
    location.href = `x-safari-${location.href}`;
  }
}
if (inApp) {
  $('inapp').style.display = 'block';
  $('btnBrowser').onclick = toBrowser;
  $('btnStay').onclick = () => { $('inapp').style.display = 'none'; };
  let tried = false;
  try { tried = sessionStorage.getItem('mn-to-browser') === '1'; sessionStorage.setItem('mn-to-browser', '1'); } catch (e) { /* no storage */ }
  if (android && !tried) toBrowser();
}

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// ?m=house opens models/house.glb straight from the link — only a name from
// this page's own models/, never another site.
const wanted = new URLSearchParams(location.search).get('m');
if (wanted && /^[A-Za-z0-9._-]+$/.test(wanted)) {
  $('empty').style.display = 'none';
  loadUrl(`models/${wanted.replace(/\.glb$/i, '')}.glb`);
}
</script>
</body>
</html>
